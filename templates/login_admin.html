<body class="bg-background min-h-screen flex items-center justify-center bg-pattern font-body-md text-on-background relative overflow-hidden">
<!-- Decorative background elements -->
<div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0 opacity-40">
<div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-primary-fixed-dim blur-3xl opacity-20"></div>
<div class="absolute top-[60%] -right-[10%] w-[40%] h-[60%] rounded-full bg-secondary-fixed-dim blur-3xl opacity-20"></div>
</div>
<!-- Main Container -->
<main class="relative z-10 w-full max-w-[440px] px-margin-mobile md:px-0">
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_12px_32px_rgba(0,0,0,0.4)] border border-surface-container-high overflow-hidden flex flex-col">
<!-- Card Header -->
<div class="px-gutter pt-lg pb-md flex flex-col items-center border-b border-surface-container">
<div class="w-16 h-16 bg-primary-container rounded-lg flex items-center justify-center mb-sm shadow-sm">
<span class="material-symbols-outlined text-on-primary-container text-display-lg" style="font-variation-settings: 'FILL' 1;">
                        precision_manufacturing
                    </span>
</div>
<h1 class="font-headline-lg text-headline-lg md:font-headline-lg md:text-headline-lg text-primary tracking-tighter text-center uppercase">Velocity Pro Equipment</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs">Acceso al Panel de Administración</p>
</div>
<!-- Card Body / Form -->
<div class="p-gutter">
<form action="/login_admin" class="flex flex-col gap-md" method="POST">
<!-- Email Field -->
<div class="relative">
<label class="absolute -top-2.5 left-3 bg-surface-container-lowest px-1 font-label-md text-label-md text-secondary" for="email">Correo Electrónico</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline-variant">
                                mail
                            </span>
<input class="w-full pl-10 pr-4 py-3 bg-transparent border border-outline rounded-lg font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" id="email" name="username" placeholder="admin@velocitypro.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="relative">
<label class="absolute -top-2.5 left-3 bg-surface-container-lowest px-1 font-label-md text-label-md text-secondary" for="password">Contraseña</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline-variant">
                                lock
                            </span>
<input class="w-full pl-10 pr-10 py-3 bg-transparent border border-outline rounded-lg font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 text-outline-variant hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">
                                    visibility_off
                                </span>
</button>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between mt-xs">
<div class="flex items-center gap-2">
<input class="w-4 h-4 rounded border-outline text-primary focus:ring-primary bg-surface-container-lowest" id="remember" name="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember">Recordarme</label>
</div>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">¿Olvidaste tu contraseña?</a>
</div>
<!-- Submit Button -->
<button class="w-full mt-sm py-3 bg-primary text-on-primary font-label-bold text-label-bold rounded-lg shadow-[0px_2px_4px_rgba(0,0,0,0.1)] hover:bg-primary-container active:shadow-none active:translate-y-[1px] transition-all flex justify-center items-center gap-2 uppercase tracking-wide" type="submit">
    Inicio de Sesión Seguro
    <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>


</form>
</div>
<!-- Card Footer -->
<div class="bg-surface-container-low px-gutter py-sm border-t border-surface-container text-center">
<p class="font-label-md text-label-md text-on-surface-variant flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[14px]">
                        shield
                    </span>
                    Solo Personal Autorizado
                </p>
</div>
</div>
<!-- Footer Links -->
<div class="mt-lg flex justify-center gap-md font-label-md text-label-md text-secondary">
<a class="hover:text-primary transition-colors" href="#">Ayuda y Soporte</a>
<span>•</span>
<a class="hover:text-primary transition-colors" href="#">Estado del Sistema</a>
</div>
</main>
<script>
        // Simple interaction for the password visibility toggle
        document.addEventListener('DOMContentLoaded', () => {
            const toggleButton = document.querySelector('button[type="button"]');
            const passwordInput = document.getElementById('password');
            const icon = toggleButton.querySelector('.material-symbols-outlined');

            toggleButton.addEventListener('click', () => {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    icon.textContent = 'visibility';
                } else {
                    passwordInput.type = 'password';
                    icon.textContent = 'visibility_off';
                }
            });
        });
    </script>
